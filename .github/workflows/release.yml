name: Mac release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      signed:
        description: 'Sign and upload product to Apple for notarization (owner authorization required)'
        required: true
        default: false
        type: boolean
permissions: {}
concurrency:
  group: mac-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.repository == 'Harflow-Dev/HarflowMac'
    runs-on: macos-26
    timeout-minutes: 35
    permissions:
      contents: read
    outputs:
      version: ${{ steps.source.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate immutable source
        id: source
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            version=$(/usr/bin/python3 -I scripts/ci/release.py source --tag "$RELEASE_TAG" --sha "$EVENT_SHA")
          else
            version=$(/usr/bin/python3 -I scripts/ci/release.py source)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build exact ad-hoc arm64 app
        run: |
          test "$(uname -m)" = arm64
          macos/build-app.sh
          /usr/bin/python3 -I scripts/ci/release.py unsigned
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent macos/build/Harflow.app validated-app.zip
          shasum -a 256 validated-app.zip > validated-app.zip.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: validated-app-${{ github.sha }}
          path: |
            validated-app.zip
            validated-app.zip.sha256
          if-no-files-found: error
      - name: Upload unsigned validation output
        if: github.event_name == 'workflow_dispatch' && !inputs.signed
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-validation-${{ github.sha }}
          path: release-dist/*
          if-no-files-found: error
  sign:
    if: github.repository == 'Harflow-Dev/HarflowMac' && (github.event_name == 'release' || inputs.signed)
    needs: build
    runs-on: macos-26
    timeout-minutes: 35
    environment: apple-signing
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: validated-app-${{ github.sha }}
          path: release-input
      - name: Verify artifact bytes
        run: |
          cd release-input
          shasum -a 256 -c validated-app.zip.sha256
          /usr/bin/ditto -x -k validated-app.zip .
      - name: Sign and notarize exact product
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
          HARFLOW_DEVELOPER_ID_P12_BASE64: ${{ secrets.HARFLOW_DEVELOPER_ID_P12_BASE64 }}
          HARFLOW_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.HARFLOW_DEVELOPER_ID_P12_PASSWORD }}
          HARFLOW_NOTARY_APPLE_ID: ${{ secrets.HARFLOW_NOTARY_APPLE_ID }}
          HARFLOW_NOTARY_APP_PASSWORD: ${{ secrets.HARFLOW_NOTARY_APP_PASSWORD }}
          HARFLOW_APPLE_TEAM_ID: ${{ secrets.HARFLOW_APPLE_TEAM_ID }}
        run: |
          if [ "$EVENT_NAME" = release ]; then
            /usr/bin/python3 -I scripts/ci/release.py sign --app release-input/Harflow.app --tag "$RELEASE_TAG" --sha "$EVENT_SHA"
          else
            /usr/bin/python3 -I scripts/ci/release.py sign --app release-input/Harflow.app
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-product-${{ github.sha }}
          path: release-dist/*
          if-no-files-found: error
  upload:
    if: github.repository == 'Harflow-Dev/HarflowMac' && github.event_name == 'release'
    needs: [build, sign]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: signed-product-${{ github.sha }}
          path: release-dist
      - name: Publish verified asset pair
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: python3 -I scripts/ci/release_assets.py --version "$VERSION"
