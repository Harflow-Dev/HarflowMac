name: Apple signing credential preflight

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: apple-signing-preflight
  cancel-in-progress: false

jobs:
  preflight:
    if: github.ref == 'refs/heads/main' && github.repository == 'Harflow-Dev/HarflowMac'
    runs-on: macos-26
    timeout-minutes: 20
    environment: apple-signing
    permissions:
      contents: read
    steps:
      - name: Check out reviewed main commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate signing and notarization credentials
        env:
          HARFLOW_DEVELOPER_ID_P12_BASE64: ${{ secrets.HARFLOW_DEVELOPER_ID_P12_BASE64 }}
          HARFLOW_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.HARFLOW_DEVELOPER_ID_P12_PASSWORD }}
          HARFLOW_NOTARY_APPLE_ID: ${{ secrets.HARFLOW_NOTARY_APPLE_ID }}
          HARFLOW_NOTARY_APP_PASSWORD: ${{ secrets.HARFLOW_NOTARY_APP_PASSWORD }}
          HARFLOW_APPLE_TEAM_ID: ${{ secrets.HARFLOW_APPLE_TEAM_ID }}
        run: /usr/bin/python3 -I scripts/ci/apple_signing_preflight.py
